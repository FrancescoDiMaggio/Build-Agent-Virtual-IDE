<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <style>
    /* ============================================================
       CRACKTRO / KEYGEN  ·  post-punk retro neon  ·  anni '90
       ============================================================ */
    :root {
      --magenta: #ff2bd6;
      --cyan:    #00f0ff;
      --green:   #39ff14;
      --amber:   #ffd400;
      --ink:     #07000d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Courier New", "Lucida Console", monospace;
      color: var(--cyan);
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255,43,214,0.18), transparent 60%),
        radial-gradient(ellipse at 50% 120%, rgba(0,240,255,0.16), transparent 55%),
        #07000d;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 0;
      user-select: none;
      cursor: default;
    }

    /* griglia prospettica di fondo */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(transparent 95%, rgba(255,43,214,0.25) 96%),
        linear-gradient(90deg, transparent 95%, rgba(0,240,255,0.18) 96%);
      background-size: 34px 34px;
      transform: perspective(320px) rotateX(58deg) translateY(40%) scale(2.4);
      transform-origin: center bottom;
      opacity: 0.35;
      pointer-events: none;
      animation: grid 14s linear infinite;
    }
    @keyframes grid { from { background-position: 0 0; } to { background-position: 0 34px; } }

    /* scanline / CRT overlay */
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 50;
    }

    .wrap { position: relative; z-index: 10; display: flex; flex-direction: column; flex: 1; }

    /* ---- logo / titolo ---- */
    .logo {
      text-align: center;
      font-weight: 700;
      letter-spacing: 3px;
      line-height: 1.05;
      margin-top: 4px;
    }
    .logo .crew {
      font-size: 11px;
      color: var(--green);
      text-shadow: 0 0 6px var(--green);
      letter-spacing: 6px;
    }
    .logo .title {
      font-size: 30px;
      margin: 4px 0 2px;
      color: #fff;
      text-shadow:
        0 0 4px #fff,
        0 0 12px var(--magenta),
        0 0 26px var(--magenta),
        2px 2px 0 var(--cyan);
      animation: flick 4.5s infinite steps(60);
    }
    .logo .sub {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan);
    }
    @keyframes flick {
      0%,17%,19%,55%,57%,100% { opacity: 1; }
      18%,56% { opacity: 0.35; }
    }

    .rule {
      height: 2px; margin: 12px 0;
      background: linear-gradient(90deg, transparent, var(--magenta), var(--cyan), var(--magenta), transparent);
      box-shadow: 0 0 8px var(--magenta);
    }

    /* ---- form ---- */
    .fields { flex: 1; }
    label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--amber);
      text-shadow: 0 0 6px rgba(255,212,0,0.6);
      margin: 12px 0 4px;
      text-transform: uppercase;
    }
    label::before { content: "» "; color: var(--magenta); }
    input[type=text], input[type=number] {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 20, 28, 0.7);
      border: 1px solid var(--cyan);
      border-radius: 0;
      color: var(--green);
      font-family: inherit;
      font-size: 13px;
      text-shadow: 0 0 6px rgba(57,255,20,0.5);
      box-shadow: inset 0 0 10px rgba(0,240,255,0.25), 0 0 6px rgba(0,240,255,0.2);
    }
    input::placeholder { color: rgba(0,240,255,0.4); }
    input:focus {
      outline: none;
      border-color: var(--magenta);
      box-shadow: inset 0 0 12px rgba(255,43,214,0.35), 0 0 12px rgba(255,43,214,0.5);
    }
    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }

    .check {
      display: flex; align-items: center; gap: 10px;
      margin-top: 16px; cursor: pointer;
      font-size: 11px; letter-spacing: 1px; color: var(--cyan);
    }
    .check input { width: 16px; height: 16px; accent-color: var(--magenta); cursor: pointer; }
    .check.disabled { opacity: 0.4; cursor: not-allowed; }

    #err {
      color: var(--magenta);
      text-shadow: 0 0 8px var(--magenta);
      font-size: 11px; min-height: 16px; margin-top: 10px;
      letter-spacing: 1px;
    }

    /* ---- pulsante START ---- */
    .actions { margin-top: 10px; }
    #start {
      width: 100%;
      padding: 13px;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--ink);
      background: var(--green);
      border: 2px solid #fff;
      cursor: pointer;
      text-shadow: 0 0 2px #fff;
      box-shadow: 0 0 14px var(--green), inset 0 0 8px rgba(255,255,255,0.6);
      animation: pulse 1.1s ease-in-out infinite alternate;
    }
    #start:hover { background: var(--magenta); color: #fff; box-shadow: 0 0 22px var(--magenta); }
    #start:disabled { animation: none; opacity: 0.5; cursor: default; }
    @keyframes pulse {
      from { box-shadow: 0 0 10px var(--green), inset 0 0 6px rgba(255,255,255,0.5); }
      to   { box-shadow: 0 0 26px var(--green), inset 0 0 12px rgba(255,255,255,0.8); }
    }

    /* ---- scroller / marquee ---- */
    .scroller {
      position: relative; z-index: 10;
      margin: 12px -20px 0;
      padding: 6px 0;
      border-top: 1px solid rgba(0,240,255,0.4);
      overflow: hidden;
      white-space: nowrap;
      font-size: 11px; letter-spacing: 1px;
      color: var(--magenta);
      text-shadow: 0 0 6px var(--magenta);
    }
    .scroller span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 26s linear infinite;
    }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }

    /* ---- indicatore audio cracktro ---- */
    #snd {
      position: absolute; top: 14px; right: 16px; z-index: 20;
      font-size: 11px; letter-spacing: 1px;
      color: var(--green); text-shadow: 0 0 6px var(--green);
      cursor: pointer;
    }
    #snd .bars { display: inline-block; }
    #snd.off { color: rgba(0,240,255,0.4); text-shadow: none; }
  </style>
</head>
<body>
  <div id="snd" title="Attiva/disattiva la musica">♪ <span class="bars">CHIPTUNE</span></div>

  <div class="wrap">
    <div class="logo">
      <div class="crew">— NEON DIVISION presents —</div>
      <div class="title">HEAP·BOOSTER</div>
      <div class="sub">V8 MEMORY OVERCLOCK · KEYGEN</div>
    </div>

    <div class="rule"></div>

    <div class="fields">
      <label for="url">TARGET URL</label>
      <input id="url" type="text" placeholder="https://your-instance.example.com/..." autofocus />

      <label for="ram">V8 HEAP CAP [ MB ]</label>
      <input id="ram" type="number" min="1024" max="14336" step="256" />

      <div class="row">
        <div>
          <label for="warn">WARN %</label>
          <input id="warn" type="number" min="5" max="95" step="5" />
        </div>
        <div>
          <label for="alert">ALERT %</label>
          <input id="alert" type="number" min="10" max="98" step="5" />
        </div>
      </div>

      <label class="check" id="plLabel" for="playlist">
        <input id="playlist" type="checkbox" />
        <span>RIPRODUCI LA PLAYLIST CHIPTUNE DURANTE L'USO</span>
      </label>

      <div id="err"></div>
    </div>

    <div class="actions">
      <button id="start">START</button>
    </div>
  </div>

  <div class="scroller"><span id="scrollText"></span></div>

  <!-- cracktro music: parte automaticamente all'apertura del launcher -->
  <audio id="cracktro" loop></audio>

  <script>
    const $ = (id) => document.getElementById(id);
    const err = $('err');
    const audio = $('cracktro');
    const snd = $('snd');

    const GREETZ =
      'WELCOME TO HEAP·BOOSTER KEYGEN  ///  ' +
      'imposta TARGET URL e premi START per lanciare il browser dedicato con heap V8 maggiorato  ///  ' +
      'usa un cap RAM ragionevole: su 16 GB il massimo consigliato e\' 12288 MB  ///  ' +
      'WARN e ALERT pilotano il semaforo di memoria  ///  ' +
      'spunta la casella per la playlist chiptune mentre lavori  ///  ' +
      'greetz to all the sceners keeping the neon alive  ///  stay frosty  ///  ';

    $('scrollText').textContent = GREETZ;

    async function load() {
      const c = await window.launcherApi.get();
      $('url').value = c.url || '';
      $('ram').value = c.maxOldSpaceSize;
      $('warn').value = Math.round(c.warnPct * 100);
      $('alert').value = Math.round(c.alertPct * 100);
      $('playlist').checked = !!c.playlist;

      if (!c.hasPlaylist) {
        $('playlist').checked = false;
        $('playlist').disabled = true;
        $('plLabel').classList.add('disabled');
      }

      // Avvia la cracktro. Con autoplay-policy disattivata parte subito;
      // se il sistema dovesse comunque bloccarla, parte al primo clic/tasto.
      if (c.loginSound) {
        audio.src = c.loginSound;
        audio.volume = 0.7;
        audio.play().catch(armOnGesture);
      }
    }
    load();

    function armOnGesture() {
      const go = () => { audio.play().catch(() => {}); cleanup(); };
      const cleanup = () => {
        document.removeEventListener('click', go);
        document.removeEventListener('keydown', go);
      };
      document.addEventListener('click', go, { once: true });
      document.addEventListener('keydown', go, { once: true });
    }

    // Mute/unmute della cracktro.
    snd.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) { audio.play().catch(() => {}); snd.classList.remove('off'); }
      else { audio.pause(); snd.classList.add('off'); }
    });

    async function start() {
      err.textContent = '';
      const url = $('url').value.trim();
      const ram = parseInt($('ram').value, 10);
      const warn = parseInt($('warn').value, 10);
      const alert = parseInt($('alert').value, 10);

      if (!/^https?:\/\//i.test(url)) { err.textContent = '! TARGET URL NON VALIDO (http/https)'; return; }
      if (!(ram >= 1024 && ram <= 14336)) { err.textContent = '! HEAP CAP FUORI RANGE (1024-14336)'; return; }
      if (!(warn >= 5 && alert <= 98 && warn < alert)) { err.textContent = '! WARN DEVE ESSERE < ALERT'; return; }

      $('start').disabled = true;
      const res = await window.launcherApi.start({
        url, maxOldSpaceSize: ram, warnPct: warn / 100, alertPct: alert / 100,
        playlist: $('playlist').checked
      });
      // Se la RAM e' cambiata il main process riavvia l'app (questa finestra
      // sparisce); altrimenti apre la finestra regolare e chiude la landing.
      if (res && !res.ok) {
        $('start').disabled = false;
        err.textContent = '! ' + (res.error || 'ERRORE IN AVVIO').toUpperCase();
      }
    }

    $('start').addEventListener('click', start);
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
  </script>
</body>
</html>
